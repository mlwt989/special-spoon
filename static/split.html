<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频拆解工具 · Video Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0A0A0A; --gray-900: #1A1A1A; --gray-700: #4A4A4A;
      --gray-500: #8A8A8A; --gray-300: #C8C8C8; --gray-200: #E0E0E0;
      --gray-100: #F0F0F0; --gray-50: #F7F7F7; --white: #FFFFFF;
      --line: #E5E5E5; --bg: #FAFAFA;
      --radius: 2px; --radius-lg: 4px; --transition: 0.2s ease;
    }
    body {
      font-family: "Noto Sans SC", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--black); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-family: "Space Grotesk", monospace; font-feature-settings: "tnum" on; }
    .page { display: flex; min-height: 100vh; }

    /* === 左侧导航 === */
    .sidebar {
      width: 180px; background: var(--black); color: var(--white);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 32px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
    }
    .sidebar-logo { padding: 0 24px; display: flex; flex-direction: column; gap: 4px; }
    .logo-mark { font-size: 14px; letter-spacing: 3px; font-weight: 700; }
    .logo-sub { font-size: 9px; letter-spacing: 2px; color: var(--gray-500); }
    .sidebar-nav { padding: 40px 0; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; font-size: 13px; color: var(--gray-500);
      cursor: pointer; transition: var(--transition); text-decoration: none;
      border-left: 2px solid transparent;
    }
    .nav-item:hover { color: var(--white); }
    .nav-item.active { color: var(--white); border-left-color: var(--white); background: rgba(255,255,255,0.04); }
    .sidebar-status { padding: 0 24px; display: flex; align-items: center; gap: 8px; }
    .status-led { width: 6px; height: 6px; border-radius: 50%; background: #7CFF9B; box-shadow: 0 0 6px #7CFF9B; }
    .status-text { font-size: 10px; letter-spacing: 2px; color: var(--gray-500); }

    /* === 主区域 === */
    .main-area { flex: 1; padding: 48px 56px 80px; min-width: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
    .page-title { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; }
    .page-desc { margin-top: 8px; font-size: 13px; color: var(--gray-500); }
    .badge-text { font-size: 11px; letter-spacing: 2px; color: var(--gray-500); }
    .badge-line { display: inline-block; width: 32px; height: 1px; background: var(--black); margin-right: 12px; vertical-align: middle; }

    /* === 上传区 === */
    .upload-zone {
      border: 1.5px dashed var(--gray-300); background: var(--white);
      padding: 72px 32px; text-align: center; cursor: pointer;
      transition: var(--transition); border-radius: var(--radius-lg);
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--black); background: var(--gray-50); }
    .upload-zone.dragover { border-style: solid; }
    .upload-icon { font-size: 32px; margin-bottom: 16px; opacity: 0.5; }
    .upload-title { font-size: 16px; font-weight: 500; }
    .upload-sub { margin-top: 8px; font-size: 12px; color: var(--gray-500); }
    .upload-file { margin-top: 16px; font-size: 12px; color: var(--gray-700); word-break: break-all; }

    /* === 参数区 === */
    .options { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; align-items: flex-end; }
    .option { display: flex; flex-direction: column; gap: 6px; }
    .option label { font-size: 11px; letter-spacing: 1px; color: var(--gray-500); }
    .option select, .option input {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius);
      font-size: 13px; background: var(--white); color: var(--black); min-width: 140px;
      font-family: inherit;
    }
    .option input:focus, .option select:focus { outline: none; border-color: var(--black); }
    .option .hint { font-size: 11px; color: var(--gray-500); max-width: 220px; line-height: 1.5; }

    /* === 按钮 === */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; background: var(--black); color: var(--white);
      border: none; font-size: 13px; letter-spacing: 1px; cursor: pointer;
      transition: var(--transition); border-radius: var(--radius);
      font-family: inherit; text-decoration: none;
    }
    .btn:hover { background: var(--gray-900); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--black); border: 1px solid var(--black); }
    .btn-ghost:hover { background: var(--black); color: var(--white); }
    .btn-sm { padding: 8px 16px; font-size: 12px; }

    /* === 进度 === */
    .progress-wrap { margin-top: 28px; display: none; }
    .progress-bar { height: 3px; background: var(--gray-200); position: relative; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--black); width: 0%; transition: width 0.3s ease; }
    .progress-text { margin-top: 10px; font-size: 12px; color: var(--gray-500); }

    /* === 结果 === */
    .result { margin-top: 40px; }
    .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .result-title { font-size: 18px; font-weight: 500; }
    .result-sub { margin-top: 4px; font-size: 12px; color: var(--gray-500); }
    .seg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .seg-card {
      background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg);
      overflow: hidden; transition: var(--transition);
    }
    .seg-card:hover { border-color: var(--gray-300); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .seg-video { width: 100%; aspect-ratio: 9/16; max-height: 320px; background: var(--black); display: block; object-fit: contain; }
    .seg-info { padding: 14px 16px; }
    .seg-name { font-size: 13px; font-weight: 500; word-break: break-all; }
    .seg-meta { margin-top: 6px; font-size: 11px; color: var(--gray-500); }
    .seg-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* === 错误 === */
    .error-box {
      margin-top: 24px; padding: 16px 20px; border: 1px solid #E5C9C9;
      background: #FBF3F3; border-radius: var(--radius-lg); font-size: 13px; color: #8A3B3B;
    }
    .error-detail { margin-top: 8px; font-size: 11px; color: #B08A8A; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }

    .empty-tip { text-align: center; padding: 48px 0; color: var(--gray-500); font-size: 13px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 左侧导航条 -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">HEYTEA</span>
        <span class="logo-sub">VIDEO STUDIO</span>
      </div>
      <div class="sidebar-nav">
        <a class="nav-item" href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
          <span>剪辑</span>
        </a>
        <a class="nav-item active" href="/split">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v18M16 3v18M3 8h18M3 16h18" stroke-dasharray="3 3"/></svg>
          <span>拆解</span>
        </a>
      </div>
      <div class="sidebar-status">
        <span class="status-led"></span>
        <span class="status-text">LOCAL</span>
      </div>
    </nav>

    <!-- 主区域 -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">视频拆解工具</h1>
          <p class="page-desc">上传剪辑好的成品视频 · 按镜头切换自动拆成素材片段</p>
        </div>
        <div class="topbar-right">
          <span class="badge-line"></span>
          <span class="badge-text">SPLIT / DECOMPOSE</span>
        </div>
      </header>

      <!-- 上传区 -->
      <div id="dropZone" class="upload-zone">
        <div class="upload-icon">🎬</div>
        <div class="upload-title">拖拽视频到这里，或点击选择</div>
        <div class="upload-sub">支持 MP4 / MOV / MKV 等 · 单个文件 · 最大 2GB</div>
        <div class="upload-file" id="fileName"></div>
        <input type="file" id="fileInput" accept="video/*" hidden>
      </div>

      <!-- 参数区 -->
      <div class="options">
        <div class="option">
          <label>检测灵敏度</label>
          <select id="threshold">
            <option value="0.2">高（0.2）· 镜头感弱也切</option>
            <option value="0.3" selected>中（0.3）· 推荐</option>
            <option value="0.4">低（0.4）· 只切明显镜头</option>
            <option value="0.5">很低（0.5）· 只切大转场</option>
          </select>
          <span class="hint">数值越小越容易检测到镜头切换</span>
        </div>
        <div class="option">
          <label>切割模式</label>
          <select id="mode">
            <option value="precise" selected>精确（重编码）· 推荐</option>
            <option value="copy">快速（流复制）· 可能不准</option>
          </select>
          <span class="hint">精确：切点准到帧，适合关键帧间隔大的视频<br>快速：秒级完成，但切点会偏移到最近关键帧</span>
        </div>
        <div class="option">
          <label>最短片段</label>
          <input type="number" id="minSeg" value="1.0" min="0.3" max="10" step="0.1">
          <span class="hint">短于此秒数的片段并入前一段（秒）</span>
        </div>
        <div class="option">
          <button id="splitBtn" class="btn" disabled>
            <span id="splitBtnText">开始拆解</span>
          </button>
        </div>
      </div>

      <!-- 进度 -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText"></div>
      </div>

      <!-- 错误 -->
      <div class="error-box" id="errorBox" style="display:none">
        <div id="errorMsg"></div>
        <div class="error-detail" id="errorDetail"></div>
      </div>

      <!-- 结果 -->
      <div class="result" id="resultArea" style="display:none">
        <div class="result-head">
          <div>
            <div class="result-title">拆解结果</div>
            <div class="result-sub" id="resultSub"></div>
          </div>
          <button class="btn" id="zipBtn">打包下载全部</button>
        </div>
        <div class="seg-grid" id="segGrid"></div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const fileName = document.getElementById('fileName');
      const splitBtn = document.getElementById('splitBtn');
      const splitBtnText = document.getElementById('splitBtnText');
      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const errorBox = document.getElementById('errorBox');
      const errorMsg = document.getElementById('errorMsg');
      const errorDetail = document.getElementById('errorDetail');
      const resultArea = document.getElementById('resultArea');
      const resultSub = document.getElementById('resultSub');
      const segGrid = document.getElementById('segGrid');
      const zipBtn = document.getElementById('zipBtn');

      let selectedFile = null;
      let currentTask = null;

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function fmtDur(s) {
        s = Number(s) || 0;
        const m = Math.floor(s / 60);
        const sec = (s % 60).toFixed(1);
        return m > 0 ? m + 'm ' + sec + 's' : sec + 's';
      }

      function fmtSize(bytes) {
        if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return bytes + ' B';
      }

      function setError(msg, detail) {
        errorMsg.textContent = msg;
        errorDetail.textContent = detail || '';
        errorDetail.style.display = detail ? 'block' : 'none';
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.style.display = 'none';
        errorMsg.textContent = '';
        errorDetail.textContent = '';
      }

      function setBusy(busy) {
        splitBtn.disabled = busy || !selectedFile;
        splitBtnText.innerHTML = busy ? '<span class="spinner"></span> 拆解中...' : '开始拆解';
      }

      function handleFile(file) {
        if (!file) return;
        if (!/\.(mp4|mov|avi|mkv|flv|wmv|webm|m4v)$/i.test(file.name)) {
          setError('不支持的文件格式，请选择视频文件');
          return;
        }
        clearError();
        selectedFile = file;
        fileName.textContent = file.name + '  (' + fmtSize(file.size) + ')';
        splitBtn.disabled = false;
        splitBtnText.textContent = '开始拆解';
        progressWrap.style.display = 'none';
        resultArea.style.display = 'none';
      }

      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

      // 上传（带进度）
      function uploadWithProgress(file, cb) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const fd = new FormData();
          fd.append('file', file);
          fd.append('threshold', document.getElementById('threshold').value);
          fd.append('mode', document.getElementById('mode').value);
          fd.append('min_seg', document.getElementById('minSeg').value);

          xhr.open('POST', '/api/split');
          xhr.timeout = 5 * 60 * 1000;
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) cb(Math.round(e.loaded / e.total * 100));
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try { resolve(JSON.parse(xhr.responseText)); }
              catch (e) { reject(new Error('响应解析失败')); }
            } else {
              let msg = '上传失败 (' + xhr.status + ')';
              try {
                const d = JSON.parse(xhr.responseText);
                if (d && d.error) msg = d.error;
              } catch (e) { /* ignore */ }
              reject(new Error(msg));
            }
          };
          xhr.onerror = () => reject(new Error('网络错误，上传中断'));
          xhr.ontimeout = () => reject(new Error('上传超时，请重试'));
          xhr.send(fd);
        });
      }

      // 轮询状态
      function pollStatus(taskId) {
        return new Promise((resolve, reject) => {
          let netFail = 0;
          const timer = setInterval(async () => {
            try {
              const resp = await fetch('/api/split/status/' + taskId);
              netFail = 0;
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const data = await resp.json();
              if (data.status === 'done') { clearInterval(timer); resolve(data); return; }
              if (data.status === 'error') { clearInterval(timer); reject(new Error(data.error || '拆解失败')); return; }
              progressFill.style.width = (data.progress || 0) + '%';
              progressText.textContent = (data.message || '处理中...') + '  [' + (data.progress || 0) + '%]';
            } catch (e) {
              netFail++;
              if (netFail >= 5) { clearInterval(timer); reject(new Error('服务器连接中断，请刷新页面查看任务')); }
            }
          }, 1200);
        });
      }

      splitBtn.addEventListener('click', async () => {
        if (!selectedFile || splitBtn.disabled) return;
        clearError();
        setBusy(true);
        progressWrap.style.display = 'block';
        progressFill.style.width = '0%';
        // 预计耗时提示：精确模式约 1.5-2.5x 视频时长；快速模式秒级
        const mode = document.getElementById('mode').value;
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(selectedFile);
        video.onloadedmetadata = () => {
          const dur = video.duration || 0;
          let tip;
          if (mode === 'precise') {
            tip = '精确模式正在拆解，预计 ' + Math.max(1, Math.round(dur * 2 / 60 + 0.5)) +
                  ' 分钟左右（镜头越多越久），请勿关闭页面';
          } else {
            tip = '快速模式拆解中，通常 1 分钟内完成';
          }
          progressText.textContent = tip;
          URL.revokeObjectURL(video.src);
        };
        video.onerror = () => {
          progressText.textContent = '上传中...  [0%]';
        };
        resultArea.style.display = 'none';

        try {
          const up = await uploadWithProgress(selectedFile, (p) => {
            progressFill.style.width = p + '%';
            progressText.textContent = '上传中...  [' + p + '%]';
          });
          currentTask = up.task_id;
          const data = await pollStatus(up.task_id);
          progressFill.style.width = '100%';
          progressText.textContent = data.message || '拆解完成';
          renderResult(data);
        } catch (e) {
          setError(e.message || '拆解失败，请重试');
        } finally {
          setBusy(false);
        }
      });

      function renderResult(data) {
        const segs = data.segments || [];
        resultSub.textContent = '共 ' + segs.length + ' 段 · 源文件：' + data.source_name;
        segGrid.innerHTML = '';

        if (!segs.length) {
          segGrid.innerHTML = '<div class="empty-tip">没有拆出片段（可能整个视频是单一镜头）</div>';
          return;
        }

        segs.forEach((seg) => {
          const card = document.createElement('div');
          card.className = 'seg-card';
          card.innerHTML =
            '<video class="seg-video" controls preload="metadata" src="/api/split/download/' +
            encodeURIComponent(currentTask) + '/' + seg.index + '"></video>' +
            '<div class="seg-info">' +
            '<div class="seg-name">片段 ' + seg.index + ' · ' + escapeHtml(seg.name) + '</div>' +
            '<div class="seg-meta num">' + fmtDur(seg.start) + ' ~ ' + fmtDur(seg.end) +
            ' &nbsp;·&nbsp; ' + fmtDur(seg.dur) + ' &nbsp;·&nbsp; ' + fmtSize(seg.size) + '</div>' +
            '<div class="seg-actions">' +
            '<a class="btn btn-sm" href="/api/split/download/' + encodeURIComponent(currentTask) +
            '/' + seg.index + '" download>下载</a>' +
            '</div>' +
            '</div>';
          segGrid.appendChild(card);
        });

        resultArea.style.display = 'block';
      }

      zipBtn.addEventListener('click', () => {
        if (!currentTask) return;
        window.location.href = '/api/split/zip/' + encodeURIComponent(currentTask);
      });
    })();
  </script>
</body>
</html>
